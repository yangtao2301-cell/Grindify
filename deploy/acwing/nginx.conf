# Install as an Nginx site after issuing a Let's Encrypt certificate for this host.
server {
    listen 80;
    server_name app7592.acapp.acwing.com.cn;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name app7592.acapp.acwing.com.cn;

    ssl_certificate /etc/letsencrypt/live/app7592.acapp.acwing.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app7592.acapp.acwing.com.cn/privkey.pem;
    client_max_body_size 20m;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        proxy_pass http://127.0.0.1:1337;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 308 /admin/;
    }

    location ^~ /admin/ {
        auth_basic "Grindify Admin";
        auth_basic_user_file /etc/nginx/.htpasswd-grindify-admin;
        proxy_pass http://127.0.0.1:3001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
